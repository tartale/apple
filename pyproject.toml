[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple"
version = "0.1.0"
description = "Tools for Apple Photos: back up iCloud Photos to disk and organize the backup"
requires-python = ">=3.9"
dependencies = ["typer>=0.12,<1", "rich>=13,<15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apple.photos" = ["applescript/*.applescript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
